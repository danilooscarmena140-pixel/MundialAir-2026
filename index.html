<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MundialAir 2026</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --gold: #FFD700; --white: #ffffff; --dark: #000; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Montserrat', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

        /* --- NAVEGACIÓN --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; background: #000; border-bottom: 2px solid var(--gold);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; }
        .logo span { color: var(--gold); }

        /* --- HERO CORREGIDO Y CENTRADO --- */
        .hero {
            height: 45vh; 
            width: 100%;
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://unsplash.com') center/cover;
            text-align: center;
            padding: 0 10px;
        }

        .hero-content { width: 100%; max-width: 900px; }

        .hero h1 { 
            font-family: 'Bebas Neue', sans-serif; 
            /* Tamaño de fuente corregido para que no se desborde */
            font-size: clamp(2.2rem, 10vw, 5rem); 
            margin: 0 auto;
            line-height: 1.1;
            letter-spacing: 1px;
            display: block;
            width: 100%;
        }

        .hero p { 
            font-weight: 400; 
            letter-spacing: 2px; 
            color: var(--gold); 
            font-size: 0.8rem;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* --- GRID VUELOS --- */
        .grid-vuelos {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; padding: 40px 5%; max-width: 1200px; margin: auto;
        }

        .card {
            background: #111; border: 1px solid #222; border-radius: 15px;
            overflow: hidden; text-align: center; padding-bottom: 20px;
        }
        .card img { width: 100%; height: 160px; object-fit: cover; opacity: 0.8; }
        .card-body { padding: 15px; }
        
        .promo-tag { background: #006847; font-size: 0.7rem; padding: 5px 10px; border-radius: 5px; font-weight: bold; margin-bottom: 10px; display: inline-block; }
        .price { font-size: 2rem; font-weight: 900; color: var(--gold); margin: 10px 0; display: block; }
        
        .btn {
            background: #fff; color: #000; border: none; padding: 12px;
            width: 90%; border-radius: 8px; font-weight: 900; cursor: pointer;
        }

        /* --- MODAL PAGO --- */
        #modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center; }
        .modal-in { background:#fff; color:#000; padding:30px; border-radius:15px; width:90%; max-width:350px; text-align:center; }
        .input { width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc; border-radius:5px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">⚽ MUNDIAL<span>AIR</span></div>
        <div style="text-align:right">
            <div style="font-size:0.5rem; color:var(--gold)">CIERRE</div>
            <div style="font-weight:900; font-size:0.8rem">44 DÍAS</div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <p>BIENVENIDO A BORDO</p>
            <h1>CONECTANDO <span style="color:var(--gold)">NACIONES</span></h1>
        </div>
    </header>

    <main class="grid-vuelos">
        <div class="card">
            <img src="https://unsplash.com" alt="Avión">
            <div class="card-body">
                <div class="promo-tag">🇲🇽 PROMO VICTORIA</div>
                <h3 style="margin:5px 0; font-size:1rem;">CDMX ➔ MONTERREY</h3>
                <span class="price">$490 USD</span>
                <button class="btn" onclick="pagar('CDMX ➔ MTY', '$490')">RESERVAR</button>
            </div>
        </div>
        <div class="card">
            <img src="https://unsplash.com" alt="Avión">
            <div class="card-body">
                <div class="promo-tag" style="background:#002868">🇺🇸 GOAL PASS</div>
                <h3 style="margin:5px 0; font-size:1rem;">MIAMI ➔ ATLANTA</h3>
                <span class="price">$610 USD</span>
                <button class="btn" onclick="pagar('MIAMI ➔ ATL', '$610')">RESERVAR</button>
            </div>
        </div>
    </main>

    <div id="modal">
        <div class="modal-in">
            <h2 style="margin-top:0">Pago Seguro ✈️</h2>
            <p id="vInfo"></p>
            <input type="text" class="input" placeholder="Nombre completo">
            <input type="text" class="input" placeholder="Número de tarjeta">
            <button onclick="cerrar()" style="background:var(--gold); border:none; padding:12px; width:100%; font-weight:900; border-radius:5px; cursor:pointer;">PAGAR AHORA</button>
            <button onclick="cerrar()" style="background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Cerrar</button>
        </div>
    </div>

    <script>
        function pagar(r, p) {
            document.getElementById('vInfo').innerText = r + " | " + p;
            document.getElementById('modal').style.display = 'flex';
        }
        function cerrar() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
